<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">FitBuddy<span>AI</span></a>
    <div class="nav-links"><a href="/">Generator</a><a href="/view-all-users">Admin View</a><a href="/docs">API Docs</a></div>
  </nav>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer>FitBuddy · AI-assisted wellness planning · Not medical advice</footer>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
